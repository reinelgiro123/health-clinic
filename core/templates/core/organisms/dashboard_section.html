<div class="row mt-4">
    <div class="col-md-3 mb-3">
        <div class="card text-white bg-primary">
            <div class="card-body">
                <h5 class="card-title"><i class="bi bi-calendar-check"></i> {{ total_appointments }}</h5>
                <p class="card-text">Total Appointments</p>
            </div>
        </div>
    </div>
    
    <div class="col-md-3 mb-3">
        <div class="card text-white bg-success">
            <div class="card-body">
                <h5 class="card-title"><i class="bi bi-check-circle"></i> {{ confirmed_appointments }}</h5>
                <p class="card-text">Confirmed</p>
            </div>
        </div>
    </div>
    
    <div class="col-md-3 mb-3">
        <div class="card text-white bg-warning">
            <div class="card-body">
                <h5 class="card-title"><i class="bi bi-clock"></i> {{ pending_appointments }}</h5>
                <p class="card-text">Pending</p>
            </div>
        </div>
    </div>
    
    <div class="col-md-3 mb-3">
        <div class="card text-white bg-danger">
            <div class="card-body">
                <h5 class="card-title"><i class="bi bi-x-circle"></i> {{ cancelled_appointments }}</h5>
                <p class="card-text">Cancelled</p>
            </div>
        </div>
    </div>
</div>
