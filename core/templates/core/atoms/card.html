<div class="card {{ class|default:'' }}">
    {% if header %}
    <div class="card-header">
        {{ header }}
    </div>
    {% endif %}
    
    <div class="card-body">
        {% if title %}
        <h5 class="card-title">{{ title }}</h5>
        {% endif %}
        {% if subtitle %}
        <h6 class="card-subtitle mb-2 text-muted">{{ subtitle }}</h6>
        {% endif %}
        {{ content }}
    </div>
    
    {% if footer %}
    <div class="card-footer">
        {{ footer }}
    </div>
    {% endif %}
</div>
